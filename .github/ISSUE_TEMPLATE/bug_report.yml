name: Bug report
description: Report a problem with Tallium.
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Minecraft, Tallium, Fabric Loader and Mod Menu versions.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and how to reproduce it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Attach relevant logs or screenshots. Remove personal information first.
